name: Package addon

# Builds ConvrgeForever.zip with a "ConvrgeForever/" folder inside (GitHub's
# own "Download ZIP" always names it "ConvrgeForever-main") and publishes it as
# the "latest" release, so this link always has the current main:
# https://github.com/stephenszpak/ConvrgeForever/releases/latest/download/ConvrgeForever.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        # Files marked export-ignore in .gitattributes are left out.
        run: git archive --format=zip --prefix=ConvrgeForever/ -o ConvrgeForever.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ConvrgeForever.zip \
            --target "$GITHUB_SHA" \
            --title "ConvrgeForever (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip into Interface/AddOns; the folder is already named ConvrgeForever." \
            --latest
